[project]
name = "genshin-autoskip"
version = "2.0.0"
description = "Automatically skips Genshin Impact dialogue, with a tray icon and an on-screen HUD"
requires-python = ">=3.11"
dependencies = [
    "mss>=10.2.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pynput==1.7.6",
    "pystray>=0.19.5",
]

[project.scripts]
genshin-autoskip = "genshin_autoskip.app:cli"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
    "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["genshin_autoskip"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
